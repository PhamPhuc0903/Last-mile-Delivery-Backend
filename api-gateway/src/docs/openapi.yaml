      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Payment detail
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Payment not found

  /payments/order/{orderId}:
    get:
      tags:
        - Payments
