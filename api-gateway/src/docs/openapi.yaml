openapi: 3.0.3

info:
  title: Last Mile Delivery API
  version: 1.0.0
  description: >
    API documentation for Last Mile Delivery Backend.
    The system uses a microservice-lite architecture with API Gateway.

servers:
  - url: http://localhost:3000
    description: Local API Gateway

tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Orders
  - name: Payments
  - name: Drivers
  - name: Dispatch
  - name: Tracking
  - name: Notifications
  - name: AI
  - name: Chatbot
  - name: Admin

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation failed

    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation failed
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
                example: body.phone
              message:
                type: string
                example: Required

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
          example: Admin Test
        phone:
          type: string
          example: "0900000001"
        email:
          type: string
          nullable: true
          example: admin@test.com
        role:
          type: string
          enum:
            - ADMIN
            - CUSTOMER
            - DRIVER
          example: ADMIN
        status:
          type: string
          example: ACTIVE
        createdAt:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required:
        - fullName
        - phone
        - password
      properties:
        fullName:
          type: string
          example: Nguyen Van A
        phone:
          type: string
          example: "0900000004"
        email:
          type: string
          nullable: true
          example: user@test.com
        password:
          type: string
          example: "123456"
        role:
          type: string
          enum:
            - CUSTOMER
            - DRIVER
          example: CUSTOMER

    LoginRequest:
      type: object
      required:
        - phone
        - password
      properties:
        phone:
          type: string
          example: "0900000001"
        password:
          type: string
          example: "123456"

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            user:
              $ref: "#/components/schemas/User"

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

    ChangePasswordRequest:
      type: object
      required:
        - oldPassword
        - newPassword
      properties:
        oldPassword:
          type: string
          example: "123456"
        newPassword:
          type: string
          example: "654321"

    ForgotPasswordRequest:
      type: object
      properties:
        phone:
          type: string
          example: "0900000001"

    ResetPasswordRequest:
      type: object
      required:
        - resetToken
        - newPassword
      properties:
        resetToken:
          type: string
        newPassword:
          type: string
          example: "123456"

    Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        fullName:
          type: string
          nullable: true
          example: Nguyen Van A
        email:
          type: string
          nullable: true
          example: customer@test.com
        avatarUrl:
          type: string
          nullable: true
          example: https://example.com/avatar.png
        dateOfBirth:
          type: string
          nullable: true
        gender:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          type: string
          example: Nguyen Van A
        email:
          type: string
          nullable: true
          example: customer@test.com
        avatarUrl:
          type: string
          nullable: true
          example: https://example.com/avatar.png
        dateOfBirth:
          type: string
          nullable: true
          example: "2002-01-01"
        gender:
          type: string
          nullable: true
          example: MALE

    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        label:
          type: string
          nullable: true
          example: Home
        receiverName:
          type: string
          example: Tran Van B
        receiverPhone:
          type: string
          example: "0912345678"
        addressLine:
          type: string
          example: 25 Le Loi
        ward:
          type: string
          example: Ben Nghe
        district:
          type: string
          example: District 1
        city:
          type: string
          example: Ho Chi Minh City
        lat:
          type: number
          nullable: true
          example: 10.776889
        lng:
          type: number
          nullable: true
          example: 106.700806
        isDefault:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateAddressRequest:
      type: object
      required:
        - receiverName
        - receiverPhone
        - addressLine
        - ward
        - district
        - city
      properties:
        label:
          type: string
          nullable: true
          example: Home
        receiverName:
          type: string
          example: Tran Van B
        receiverPhone:
          type: string
          example: "0912345678"
        addressLine:
          type: string
          example: 25 Le Loi
        ward:
          type: string
          example: Ben Nghe
        district:
          type: string
          example: District 1
        city:
          type: string
          example: Ho Chi Minh City
        lat:
          type: number
          nullable: true
          example: 10.776889
        lng:
          type: number
          nullable: true
          example: 106.700806
        isDefault:
          type: boolean
          example: true

    UpdateAddressRequest:
      type: object
      properties:
        label:
          type: string
          nullable: true
          example: Office
        receiverName:
          type: string
          example: Tran Van B
        receiverPhone:
          type: string
          example: "0912345678"
        addressLine:
          type: string
          example: 10 Nguyen Hue
        ward:
          type: string
          example: Ben Nghe
        district:
          type: string
          example: District 1
        city:
          type: string
          example: Ho Chi Minh City
        lat:
          type: number
          nullable: true
          example: 10.776889
        lng:
          type: number
          nullable: true
          example: 106.700806
        isDefault:
          type: boolean
          example: false
    OrderItemRequest:
      type: object
      required:
        - itemName
      properties:
        itemName:
          type: string
          example: Shoes
        quantity:
          type: integer
          example: 1
        weightKg:
          type: number
          nullable: true
          example: 0.8
        note:
          type: string
          nullable: true
          example: Fragile item

    OrderItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        itemName:
          type: string
          example: Shoes
        quantity:
          type: integer
          example: 1
        weightKg:
          type: number
          nullable: true
          example: 0.8
        note:
          type: string
          nullable: true

    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - PENDING
            - CONFIRMED
            - ASSIGNED
            - PICKED_UP
            - IN_TRANSIT
            - DELIVERED
            - CANCELLED
            - FAILED
          example: PENDING
        pickupAddressLine:
          type: string
          example: 12 Nguyen Van Cu
        pickupWard:
          type: string
          example: Ward 1
        pickupDistrict:
          type: string
          example: District 5
        pickupCity:
          type: string
          example: Ho Chi Minh City
        pickupLat:
          type: number
          nullable: true
          example: 10.762622
        pickupLng:
          type: number
          nullable: true
          example: 106.660172
        receiverName:
          type: string
          example: Tran Van B
        receiverPhone:
          type: string
          example: "0912345678"
        deliveryAddressLine:
          type: string
          example: 25 Le Loi
        deliveryWard:
          type: string
          example: Ben Nghe
        deliveryDistrict:
          type: string
          example: District 1
        deliveryCity:
          type: string
          example: Ho Chi Minh City
        deliveryLat:
          type: number
          nullable: true
          example: 10.776889
        deliveryLng:
          type: number
          nullable: true
          example: 106.700806
        distanceKm:
          type: number
          nullable: true
          example: 5.2
        shippingFee:
          type: number
          example: 41000
        paymentMethod:
          type: string
          enum:
            - COD
            - BANK_TRANSFER
            - MOMO
            - VNPAY
          example: COD
        paymentStatus:
          type: string
          enum:
            - UNPAID
            - PAID
            - REFUNDED
            - FAILED
          example: UNPAID
        note:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateOrderRequest:
      type: object
      required:
        - pickupAddressLine
        - receiverName
        - receiverPhone
        - deliveryAddressLine
        - items
      properties:
        pickupAddressLine:
          type: string
          example: 12 Nguyen Van Cu
        pickupWard:
          type: string
          example: Ward 1
        pickupDistrict:
          type: string
          example: District 5
        pickupCity:
          type: string
          example: Ho Chi Minh City
        pickupLat:
          type: number
          nullable: true
          example: 10.762622
        pickupLng:
          type: number
          nullable: true
          example: 106.660172
        receiverName:
          type: string
          example: Tran Van B
        receiverPhone:
          type: string
          example: "0912345678"
        deliveryAddressLine:
          type: string
          example: 25 Le Loi
        deliveryWard:
          type: string
          example: Ben Nghe
        deliveryDistrict:
          type: string
          example: District 1
        deliveryCity:
          type: string
          example: Ho Chi Minh City
        deliveryLat:
          type: number
          nullable: true
          example: 10.776889
        deliveryLng:
          type: number
          nullable: true
          example: 106.700806
        distanceKm:
          type: number
          example: 5.2
        shippingFee:
          type: number
          nullable: true
          example: 41000
        paymentMethod:
          type: string
          enum:
            - COD
            - BANK_TRANSFER
            - MOMO
            - VNPAY
          example: COD
        note:
          type: string
          nullable: true
          example: Please call before delivery
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemRequest"

    UpdateOrderRequest:
      type: object
      properties:
        pickupAddressLine:
          type: string
          example: 12 Nguyen Van Cu
        receiverName:
          type: string
          example: Tran Van B
        receiverPhone:
          type: string
          example: "0912345678"
        deliveryAddressLine:
          type: string
          example: 25 Le Loi
        distanceKm:
          type: number
          example: 5.2
        shippingFee:
          type: number
          example: 41000
        paymentMethod:
          type: string
          enum:
            - COD
            - BANK_TRANSFER
            - MOMO
            - VNPAY
          example: COD
        note:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemRequest"

    CancelOrderRequest:
      type: object
      properties:
        reason:
          type: string
          example: Customer requested cancellation

    UpdateOrderStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - PENDING
            - CONFIRMED
            - ASSIGNED
            - PICKED_UP
            - IN_TRANSIT
            - DELIVERED
            - CANCELLED
            - FAILED
          example: CONFIRMED
        note:
          type: string
          nullable: true
          example: Order confirmed by admin

    PaymentTransaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        amount:
          type: number
          example: 41000
        paymentMethod:
          type: string
          enum:
            - COD
            - BANK_TRANSFER
            - MOMO
            - VNPAY
          example: COD
        paymentStatus:
          type: string
          enum:
            - UNPAID
            - PENDING
            - PAID
            - FAILED
            - REFUNDED
            - CANCELLED
          example: UNPAID
        transactionType:
          type: string
          enum:
            - PAYMENT
            - REFUND
            - COD_COLLECTION
          example: COD_COLLECTION
        providerTransactionId:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreatePaymentRequest:
      type: object
      required:
        - orderId
        - amount
        - paymentMethod
      properties:
        orderId:
          type: string
          format: uuid
        amount:
          type: number
          example: 41000
        paymentMethod:
          type: string
          enum:
            - COD
            - BANK_TRANSFER
            - MOMO
            - VNPAY
          example: COD
        customerId:
          type: string
          format: uuid
          nullable: true
        providerTransactionId:
          type: string
          nullable: true
        note:
          type: string
          nullable: true

    MarkPaymentPaidRequest:
      type: object
      properties:
        providerTransactionId:
          type: string
          nullable: true
          example: MOMO_123456
        note:
          type: string
          nullable: true
          example: Payment confirmed by admin

    MarkPaymentFailedRequest:
      type: object
      properties:
        note:
          type: string
          nullable: true
          example: Payment failed from provider

    RefundPaymentRequest:
      type: object
      properties:
        amount:
          type: number
          nullable: true
          example: 41000
        reason:
          type: string
          nullable: true
          example: Customer requested refund
    Driver:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        vehicleType:
          type: string
          enum:
            - MOTORBIKE
            - CAR
            - VAN
          example: MOTORBIKE
        vehiclePlate:
          type: string
          nullable: true
          example: 59A1-12345
        licenseNumber:
          type: string
          nullable: true
          example: GPLX123456
        status:
          type: string
          enum:
            - OFFLINE
            - ONLINE
            - BUSY
            - SUSPENDED
          example: ONLINE
        verificationStatus:
          type: string
          enum:
            - PENDING
            - APPROVED
            - REJECTED
          example: APPROVED
        currentLat:
          type: number
          nullable: true
          example: 10.776889
        currentLng:
          type: number
          nullable: true
          example: 106.700806
        rating:
          type: number
          example: 5
        totalDeliveries:
          type: integer
          example: 10
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateDriverProfileRequest:
      type: object
      properties:
        vehicleType:
          type: string
          enum:
            - MOTORBIKE
            - CAR
            - VAN
          example: MOTORBIKE
        vehiclePlate:
          type: string
          example: 59A1-12345
        licenseNumber:
          type: string
          example: GPLX123456

    UpdateDriverStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - OFFLINE
            - ONLINE
            - BUSY
            - SUSPENDED
          example: ONLINE

    UpdateDriverLocationRequest:
      type: object
      required:
        - lat
        - lng
      properties:
        lat:
          type: number
          example: 10.776889
        lng:
          type: number
          example: 106.700806
        heading:
          type: number
          nullable: true
          example: 90
        speed:
          type: number
          nullable: true
          example: 35

    RejectDriverRequest:
      type: object
      properties:
        reason:
          type: string
          nullable: true
          example: Missing required documents

    DeliveryAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        driverUserId:
          type: string
          format: uuid
        driverProfileId:
          type: string
          format: uuid
          nullable: true
        assignedBy:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum:
            - PENDING
            - ACCEPTED
            - REJECTED
            - CANCELLED
            - COMPLETED
            - EXPIRED
          example: PENDING
        rejectReason:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        acceptedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateAssignmentRequest:
      type: object
      required:
        - orderId
      properties:
        orderId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
          description: Driver profile id
        driverProfileId:
          type: string
          format: uuid
          description: Driver profile id
        driverUserId:
          type: string
          format: uuid
          description: Auth user id of driver
        note:
          type: string
          nullable: true
          example: Manual assignment by admin

    AutoAssignRequest:
      type: object
      required:
        - orderId
        - pickupLat
        - pickupLng
      properties:
        orderId:
          type: string
          format: uuid
        pickupLat:
          type: number
          example: 10.762622
        pickupLng:
          type: number
          example: 106.660172
        radiusKm:
          type: number
          example: 5
        maxDistanceKm:
          type: number
          example: 5

    RejectAssignmentRequest:
      type: object
      properties:
        reason:
          type: string
          example: Driver is unavailable
        rejectReason:
          type: string
          example: Driver is unavailable

    CancelAssignmentRequest:
      type: object
      properties:
        reason:
          type: string
          example: Reassigning to another driver
        note:
          type: string
          example: Reassigning to another driver
    TrackingLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        driverUserId:
          type: string
          format: uuid
          nullable: true
        driverProfileId:
          type: string
          format: uuid
          nullable: true
        lat:
          type: number
          example: 10.776889
        lng:
          type: number
          example: 106.700806
        heading:
          type: number
          nullable: true
          example: 90
        speed:
          type: number
          nullable: true
          example: 35
        eventType:
          type: string
          enum:
            - LOCATION_UPDATE
            - PICKED_UP
            - IN_TRANSIT
            - DELIVERED
            - FAILED
          example: LOCATION_UPDATE
        note:
          type: string
          nullable: true
        recordedAt:
          type: string
          format: date-time

    CreateTrackingLocationRequest:
      type: object
      required:
        - orderId
        - lat
        - lng
      properties:
        orderId:
          type: string
          format: uuid
        lat:
          type: number
          example: 10.776889
        lng:
          type: number
          example: 106.700806
        heading:
          type: number
          nullable: true
          example: 90
        speed:
          type: number
          nullable: true
          example: 35
        eventType:
          type: string
          enum:
            - LOCATION_UPDATE
            - PICKED_UP
            - IN_TRANSIT
            - DELIVERED
            - FAILED
          example: LOCATION_UPDATE
        note:
          type: string
          nullable: true

    CreateOrderTrackingLocationRequest:
      type: object
      required:
        - lat
        - lng
      properties:
        lat:
          type: number
          example: 10.776889
        lng:
          type: number
          example: 106.700806
        heading:
          type: number
          nullable: true
          example: 90
        speed:
          type: number
          nullable: true
          example: 35
        eventType:
          type: string
          enum:
            - LOCATION_UPDATE
            - PICKED_UP
            - IN_TRANSIT
            - DELIVERED
            - FAILED
          example: LOCATION_UPDATE
        note:
          type: string
          nullable: true

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        title:
          type: string
          example: Order updated
        message:
          type: string
          example: Your order status has changed.
        type:
          type: string
          enum:
            - ORDER
            - PAYMENT
            - DRIVER
            - DISPATCH
            - SYSTEM
            - PROMOTION
          example: ORDER
        channel:
          type: string
          enum:
            - IN_APP
            - EMAIL
            - SMS
            - PUSH
          example: IN_APP
        status:
          type: string
          enum:
            - UNREAD
            - READ
          example: UNREAD
        metadata:
          type: object
          nullable: true
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    CreateNotificationRequest:
      type: object
      required:
        - userId
        - title
        - message
      properties:
        userId:
          type: string
          format: uuid
        title:
          type: string
          example: Order updated
        message:
          type: string
          example: Your order status has changed.
        type:
          type: string
          enum:
            - ORDER
            - PAYMENT
            - DRIVER
            - DISPATCH
            - SYSTEM
            - PROMOTION
          example: ORDER
        channel:
          type: string
          enum:
            - IN_APP
            - EMAIL
            - SMS
            - PUSH
          example: IN_APP
        metadata:
          type: object
          nullable: true

    CreateBulkNotificationsRequest:
      type: object
      required:
        - userIds
        - title
        - message
      properties:
        userIds:
          type: array
          items:
            type: string
            format: uuid
        title:
          type: string
          example: System maintenance
        message:
          type: string
          example: The system will be maintained tonight.
        type:
          type: string
          enum:
            - ORDER
            - PAYMENT
            - DRIVER
            - DISPATCH
            - SYSTEM
            - PROMOTION
          example: SYSTEM
        channel:
          type: string
          enum:
            - IN_APP
            - EMAIL
            - SMS
            - PUSH
          example: IN_APP
        metadata:
          type: object
          nullable: true
    EtaPredictRequest:
      type: object
      required:
        - distanceKm
      properties:
        orderId:
          type: string
          format: uuid
          nullable: true
        distanceKm:
          type: number
          example: 5.2
        averageSpeedKmh:
          type: number
          example: 25
        trafficLevel:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
          example: MEDIUM
        pickupHour:
          type: integer
          example: 17
        vehicleType:
          type: string
          enum:
            - MOTORBIKE
            - CAR
            - VAN
          example: MOTORBIKE
        driverRating:
          type: number
          example: 4.8
        driverTotalDeliveries:
          type: integer
          example: 120

    EtaPredictionResponse:
      type: object
      properties:
        estimatedMinutes:
          type: integer
          example: 18
        modelSource:
          type: string
          example: trained_model
        modelName:
          type: string
          nullable: true
          example: ETA_PREDICTION
        modelVersion:
          type: string
          nullable: true
          example: eta-linear-1710000000000
        confidence:
          type: number
          example: 0.82
        explanation:
          type: string

    EtaTrainingSampleRequest:
      type: object
      required:
        - distanceKm
        - actualMinutes
      properties:
        orderId:
          type: string
          format: uuid
          nullable: true
        distanceKm:
          type: number
          example: 5.2
        averageSpeedKmh:
          type: number
          example: 25
        trafficLevel:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
          example: MEDIUM
        pickupHour:
          type: integer
          example: 17
        vehicleType:
          type: string
          enum:
            - MOTORBIKE
            - CAR
            - VAN
          example: MOTORBIKE
        driverRating:
          type: number
          example: 4.8
        driverTotalDeliveries:
          type: integer
          example: 120
        actualMinutes:
          type: integer
          example: 22

    SeedEtaTrainingSamplesRequest:
      type: object
      properties:
        count:
          type: integer
          example: 50

    RecommendDriverRequest:
      type: object
      required:
        - pickupLat
        - pickupLng
      properties:
        orderId:
          type: string
          format: uuid
          nullable: true
        pickupLat:
          type: number
          example: 10.762622
        pickupLng:
          type: number
          example: 106.660172
        radiusKm:
          type: number
          example: 5
        drivers:
          type: array
          nullable: true
          items:
            type: object

    AnomalyDetectionRequest:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
          nullable: true
        distanceKm:
          type: number
          example: 55
        shippingFee:
          type: number
          example: 1200000
        codAmount:
          type: number
          example: 6000000
        etaMinutes:
          type: integer
          example: 190
        driverDistanceKm:
          type: number
          example: 16

    RiskScoreRequest:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
          nullable: true
        distanceKm:
          type: number
          example: 35
        shippingFee:
          type: number
          example: 700000
        codAmount:
          type: number
          example: 3500000
        etaMinutes:
          type: integer
          example: 130
        driverDistanceKm:
          type: number
          example: 11

    ChatSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          nullable: true
          example: Support order status
        status:
          type: string
          example: ACTIVE
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ChatMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        sender:
          type: string
          enum:
            - USER
            - BOT
          example: USER
        message:
          type: string
          example: Đơn hàng của tôi đang ở đâu?
        metadata:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time

    CreateChatSessionRequest:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          nullable: true
          example: Support order status

    SendChatMessageRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Đơn hàng của tôi đang ở đâu?
        orderId:
          type: string
          format: uuid
          nullable: true
    AdminCreateUserRequest:
      type: object
      required:
        - fullName
        - phone
        - password
        - role
      properties:
        fullName:
          type: string
          example: Admin Created User
        phone:
          type: string
          example: "0900000099"
        email:
          type: string
          nullable: true
          example: created@test.com
        password:
          type: string
          example: "123456"
        role:
          type: string
          enum:
            - ADMIN
            - CUSTOMER
            - DRIVER
          example: CUSTOMER

    AdminUpdateUserRequest:
      type: object
      properties:
        fullName:
          type: string
          example: Updated User
        phone:
          type: string
          example: "0900000099"
        email:
          type: string
          nullable: true
          example: updated@test.com
        role:
          type: string
          enum:
            - ADMIN
            - CUSTOMER
            - DRIVER
          example: CUSTOMER
        status:
          type: string
          enum:
            - ACTIVE
            - BLOCKED
            - DELETED
          example: ACTIVE

    AdminUpdateDriverStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - OFFLINE
            - ONLINE
            - BUSY
            - SUSPENDED
          example: SUSPENDED

paths:
  /health:
    get:
      tags:
        - Health
      summary: Check API Gateway health
      responses:
        "200":
          description: Gateway is running

  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new customer or driver account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered successfully
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "409":
          description: Phone or email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      tags:
        - Auth
      summary: Login with phone and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Missing phone or password
        "401":
          description: Invalid credentials
        "403":
          description: User account is not active

  /auth/refresh-token:
    post:
      tags:
        - Auth
      summary: Generate a new access token from refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: New access token generated
        "400":
          description: Refresh token is required
        "401":
          description: Invalid refresh token

  /auth/me:
    get:
      tags:
        - Auth
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user information
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
        "404":
          description: User not found

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout successfully
        "401":
          description: Unauthorized

  /auth/change-password:
    patch:
      tags:
        - Auth
      summary: Change current user's password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed successfully
        "400":
          description: Invalid password data
        "401":
          description: Unauthorized
        "403":
          description: User account is not active
        "404":
          description: User not found

  /auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Generate reset password token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Reset token generated
        "400":
          description: phone or email is required
        "403":
          description: User account is not active
        "404":
          description: User not found

  /auth/reset-password:
    post:
      tags:
        - Auth
      summary: Reset password by reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset successfully
        "400":
          description: Invalid input
        "401":
          description: Invalid reset token
        "403":
          description: User account is not active
        "404":
          description: User not found

  /auth/admin-test:
    get:
      tags:
        - Auth
      summary: Test admin-only route
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Admin access granted
        "401":
          description: Unauthorized
        "403":
          description: Admin role required

  /users/me:
    get:
      tags:
        - Users
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Profile"
        "401":
          description: Unauthorized

    patch:
      tags:
        - Users
      summary: Update current user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profile updated successfully
        "400":
          description: Invalid input
        "401":
          description: Unauthorized

  /users/me/addresses:
    get:
      tags:
        - Users
      summary: Get current user's addresses
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Address list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Address"
        "401":
          description: Unauthorized

    post:
      tags:
        - Users
      summary: Create a new address for current user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAddressRequest"
      responses:
        "201":
          description: Address created successfully
        "400":
          description: Invalid input
        "401":
          description: Unauthorized

  /users/me/addresses/{id}:
    get:
      tags:
        - Users
      summary: Get address by id
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Address detail
        "401":
          description: Unauthorized
        "404":
          description: Address not found

    patch:
      tags:
        - Users
      summary: Update address by id
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAddressRequest"
      responses:
        "200":
          description: Address updated successfully
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
        "404":
          description: Address not found

    delete:
      tags:
        - Users
      summary: Delete address by id
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Address deleted successfully
        "401":
          description: Unauthorized
        "404":
          description: Address not found
  /orders:
    post:
      tags:
        - Orders
      summary: Create a new order
      description: CUSTOMER or ADMIN can create an order.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created successfully
        "400":
          description: Invalid order data
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

    get:
      tags:
        - Orders
      summary: Get all orders
      description: ADMIN only.
      security:
        - bearerAuth: [ ]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            example: 1
        - name: limit
          in: query
          schema:
            type: integer
            example: 10
        - name: status
          in: query
          schema:
            type: string
            example: PENDING
        - name: customerId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Order list
        "401":
          description: Unauthorized
        "403":
          description: Admin role required

  /orders/my-orders:
    get:
      tags:
        - Orders
      summary: Get current customer's orders
      description: CUSTOMER or ADMIN.
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: Current user's orders
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /orders/{id}:
    get:
      tags:
        - Orders
      summary: Get order by id
      description: ADMIN can access all orders. CUSTOMER can access own orders. DRIVER can access assigned orders.
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Order detail
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Order not found

    patch:
      tags:
        - Orders
      summary: Update order information
      description: CUSTOMER can update own PENDING/CONFIRMED orders. ADMIN can update allowed orders.
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderRequest"
      responses:
        "200":
          description: Order updated successfully
        "400":
          description: Invalid order data
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Order not found

  /orders/{id}/cancel:
    patch:
      tags:
        - Orders
      summary: Cancel order
      description: CUSTOMER can cancel own PENDING/CONFIRMED orders. ADMIN can cancel allowed orders.
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelOrderRequest"
      responses:
        "200":
          description: Order cancelled successfully
        "400":
          description: Order cannot be cancelled
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Order not found

  /orders/{id}/status:
    patch:
      tags:
        - Orders
      summary: Update order status
      description: ADMIN only.
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusRequest"
      responses:
        "200":
          description: Order status updated
        "400":
          description: Invalid status
        "401":
          description: Unauthorized
        "403":
          description: Admin role required
        "404":
          description: Order not found

  /orders/{id}/timeline:
    get:
      tags:
        - Orders
      summary: Get order status timeline
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Order timeline
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Order not found

  /orders/stats/today:
    get:
      tags:
        - Orders
      summary: Get today's order statistics
      description: ADMIN only.
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: Today's order statistics
        "403":
          description: Admin role required

  /orders/stats/month:
    get:
      tags:
        - Orders
      summary: Get current month's order statistics
      description: ADMIN only.
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: Monthly order statistics
        "403":
          description: Admin role required

  /orders/stats/year:
    get:
      tags:
        - Orders
      summary: Get current year's order statistics
      description: ADMIN only.
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: Yearly order statistics
        "403":
          description: Admin role required

  /payments:
    post:
      tags:
        - Payments
      summary: Create payment transaction
      description: CUSTOMER can create payment for own order. ADMIN can create payment for valid order.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "201":
          description: Payment created successfully
        "400":
          description: Invalid payment data
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Order not found

  /payments/my-payments:
    get:
      tags:
        - Payments
      summary: Get current user's payments
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: Current user's payment transactions
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /payments/{id}:
    get:
      tags:
        - Payments
